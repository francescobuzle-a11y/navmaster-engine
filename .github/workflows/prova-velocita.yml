# La prova del modello delle velocità sui grafi veri: i Paesi dell'input countries (austria e czech-republic
# di default, o per esempio italy,austria per le Alpi) importati da Geofabrik
# coi due modelli (navmaster: cartello, legge del Paese, ritardi a semafori, stop, precedenze e
# rotatorie; ors: accelerazione per way, come prima), poi la sonda BrnoMikulovProbeTest sui grafi
# navmaster e la prova SpeedModelRealTest (la statale 52 fra Mikulov e Pohořelice, Wien → Brno per
# il valico di Mikulov, i tempi di una decina di viaggi coi due modelli). Niente viene pubblicato.
# Coi grafi navmaster anche il modello del terreno (input dem): le celle .hgt del riquadro di ogni Paese
# preparate da tools/dem/scarica-dem.sh (Copernicus GLO-90 con GDAL, skadi di riserva) e passate con
# --dem alle sole importazioni navmaster; i grafi ors non lo vedono mai. Se il DEM non si trova (GLO-90 e
# skadi falliti) il Paese si costruisce senza, con un ::warning::. Il riassunto mostra le righe «terreno»
# dell'import: quota dei km del camion frenati dalla pendenza per classe (in pianura vicina a zero) e
# perdite delle curve.
name: Prova delle velocità

on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Paesi Geofabrik (europe/…) separati da virgole, es. austria,czech-republic o italy,austria"
        default: "austria,czech-republic"
      probe:
        description: "Lancia anche la sonda BrnoMikulovProbeTest sui grafi navmaster (yes/no; solo con austria e czech-republic)"
        default: "yes"
      ors:
        description: "Costruisce anche i grafi col modello ors per il confronto (yes/no)"
        default: "yes"
      dem:
        description: "Pendenze del camion nei grafi navmaster: glo90 (Copernicus, GDAL), skadi (riserva) o none"
        default: "glo90"

env:
  GEOFABRIK: https://download.geofabrik.de/europe
  VEHICLE_ROADS: motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,residential,living_street,service,road,track,busway

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Spazio sul disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup /usr/share/swift || true
          sudo mkdir -p /mnt/w && sudo chown $USER /mnt/w
          df -h / /mnt; free -g
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Compila il motore
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :engine-cli:installDist -q
      - name: Grafi (navmaster e ors)
        working-directory: /mnt/w
        env:
          COUNTRIES: ${{ inputs.countries || 'austria,czech-republic' }}
          ORS: ${{ inputs.ors || 'yes' }}
          DEM: ${{ inputs.dem || 'glo90' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool >/dev/null
          if [ "$DEM" = "glo90" ]; then sudo apt-get install -y -qq gdal-bin >/dev/null || echo "GDAL non installato: si userà skadi"; fi
          CLI=$GITHUB_WORKSPACE/engine-cli/build/install/engine-cli/bin/engine-cli
          MEM=$(( $(free -g | awk '/Mem:/{print $2}') - 3 ))
          NAV=""; ORSG=""
          case "$DEM" in glo90|skadi|none) ;; *) echo "dem: glo90, skadi o none, non «$DEM»"; exit 2 ;; esac
          for c in $(echo "$COUNTRIES" | tr ',' ' '); do
            # il Paese ISO dei limiti legali del camion (gli altri: limiti di riserva)
            case "$c" in
              austria) CC=AT ;; czech-republic) CC=CZ ;; italy) CC=IT ;; germany) CC=DE ;; switzerland) CC=CH ;;
              slovenia) CC=SI ;; croatia) CC=HR ;; slovakia) CC=SK ;; hungary) CC=HU ;; poland) CC=PL ;;
              france) CC=FR ;; spain) CC=ES ;; portugal) CC=PT ;; netherlands) CC=NL ;; belgium) CC=BE ;;
              luxembourg) CC=LU ;; denmark) CC=DK ;; liechtenstein) CC=LI ;; romania) CC=RO ;; bulgaria) CC=BG ;;
              greece) CC=GR ;; serbia) CC=RS ;; bosnia-herzegovina) CC=BA ;; montenegro) CC=ME ;; albania) CC=AL ;;
              macedonia) CC=MK ;; sweden) CC=SE ;; norway) CC=NO ;; finland) CC=FI ;; estonia) CC=EE ;;
              latvia) CC=LV ;; lithuania) CC=LT ;; great-britain) CC=GB ;; ireland-and-northern-ireland) CC=IE ;;
              ukraine) CC=UA ;; turkey) CC=TR ;; *) CC="" ;;
            esac
            COUNTRY=""; [ -n "$CC" ] && COUNTRY="--country=$CC"
            curl -fsSL --retry 8 --retry-delay 45 --retry-all-errors --retry-connrefused -o region.osm.pbf "$GEOFABRIK/$c-latest.osm.pbf" \
              || { echo "Geofabrik non risponde: copia di openstreetmap.fr"; curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors -o region.osm.pbf "https://download.openstreetmap.fr/extracts/europe/$(echo $c | tr - _)-latest.osm.pbf"; }
            osmium tags-filter region.osm.pbf w/highway=$VEHICLE_ROADS w/route=ferry,shuttle_train r/type=restriction -o roads-$c.osm.pbf --overwrite
            rm region.osm.pbf
            DEMOPT=""
            if [ "$DEM" != "none" ]; then
              echo "== $c DEM ($DEM)"
              # GLO-90 e skadi falliti: il Paese senza DEM (solo le curve), detto nel riassunto della corsa
              if bash $GITHUB_WORKSPACE/tools/dem/scarica-dem.sh "$DEM" roads-$c.osm.pbf /mnt/w/dem-$c 2>&1 | tee dem-$c.log; then
                DEMOPT="--dem=/mnt/w/dem-$c"
              else
                echo "::warning::$c: nessun DEM ($DEM e la riserva skadi falliti): grafo navmaster senza pendenze"
              fi
            fi
            echo "== $c navmaster (${CC:-limiti di riserva})"
            JAVA_OPTS="-Xmx${MEM}g -XX:+UseParallelGC" $CLI import roads-$c.osm.pbf nav/$c --mmap --speed-model=navmaster $COUNTRY $DEMOPT 2>&1 | awk '{ print strftime("%H:%M:%S"), $0; fflush() }' | tee import-nav-$c.log
            rm -rf /mnt/w/dem-$c
            NAV="$NAV${NAV:+,}$c=/mnt/w/nav/$c"
            if [ "$ORS" = "yes" ]; then
              echo "== $c ors"
              JAVA_OPTS="-Xmx${MEM}g -XX:+UseParallelGC" $CLI import roads-$c.osm.pbf ors/$c --mmap --speed-model=ors 2>&1 | awk '{ print strftime("%H:%M:%S"), $0; fflush() }' | tee import-ors-$c.log
              ORSG="$ORSG${ORSG:+,}$c=/mnt/w/ors/$c"
            fi
            rm roads-$c.osm.pbf
          done
          echo "NM_SPEED_NAV=$NAV" >> "$GITHUB_ENV"
          echo "NM_SPEED_ORS=$ORSG" >> "$GITHUB_ENV"
          echo "NM_CB=$NAV" >> "$GITHUB_ENV"
          echo "== riassunto"
          grep -HE "(grafo:|modello delle|ritardi|archi con ritardo|camion, velocità|camion sotto|terreno|Core .*nodi nel core)" import-*.log || true
          grep -HE "(DEM pronto|bordi comuni|riserva skadi|ATTENZIONE)" dem-*.log 2>/dev/null || true
          # le righe del terreno anche nel riassunto della corsa (quota frenata dalla pendenza per classe, curve)
          { echo "### Terreno del camion"; echo '```'; for f in import-nav-*.log; do echo "${f#import-nav-}"; grep -E "terreno" "$f" | cut -d' ' -f2- || true; done; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          du -sh nav/* ors/* 2>/dev/null || true; df -h /mnt
      - name: Sonda Brno/Mikulov sui grafi navmaster
        if: inputs.probe != 'no' && contains(inputs.countries || 'austria,czech-republic', 'czech-republic') && contains(inputs.countries || 'austria,czech-republic', 'austria')
        run: |
          ./gradlew --no-daemon :engine-core:test --tests it.navmaster.engine.api.BrnoMikulovProbeTest -i 2>&1 | tee sonda.log | grep -E "^\s{4}sonda|PASSED|FAILED|BUILD" || true
      - name: Sonda alpina (Canneto → Wien e Bielsko-Biała per Tarvisio, Pusteria e Brennero)
        if: inputs.probe != 'no' && contains(inputs.countries || 'austria,czech-republic', 'italy') && contains(inputs.countries || 'austria,czech-republic', 'austria')
        run: |
          ./gradlew --no-daemon :engine-core:test --tests it.navmaster.engine.api.AlpineRouteProbeTest -i 2>&1 | tee sonda-alpi.log | grep -E "^\s{4}sonda|PASSED|FAILED|BUILD" || true
      - name: Prova del modello delle velocità
        run: |
          ./gradlew --no-daemon :engine-core:test --tests it.navmaster.engine.SpeedModelRealTest -i 2>&1 | tee prova.log | grep -E "^\s{4}velocità|PASSED|FAILED|BUILD|AssertionError" || true
          grep -q "BUILD SUCCESSFUL" prova.log
      - name: Registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prova-velocita
          path: |
            /mnt/w/import-*.log
            /mnt/w/dem-*.log
            sonda.log
            sonda-alpi.log
            prova.log
